<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>تحدي كيمياء الكشوفات - لعبة الثعبان</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      --border-color: #334155;
      --board-bg: #020617;
      --snake-head: #22c55e;
      --snake-body: #4ade80;
      --item-bg: #4338ca;
      --danger: #ef4444;
      --success: #10b981;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent: #0284c7;
      --border-color: #cbd5e1;
      --board-bg: #e2e8f0;
      --snake-head: #15803d;
      --snake-body: #22c55e;
      --item-bg: #4f46e5;
      --danger: #dc2626;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      transition: background-color 0.3s, color 0.3s;
    }

    .main-wrapper {
      width: 100%;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .designer-banner {
      width: 100%;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }

    .stats-bar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 3px;
      border-radius: 6px;
      text-align: center;
      font-size: 10px;
    }

    .stat-val {
      font-weight: bold;
      font-size: 12px;
      color: var(--accent);
    }

    .question-box {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 4px 8px;
      text-align: center;
      min-height: 44px;
      max-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.25;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: min(88vw, 360px);
      aspect-ratio: 1;
      background-color: var(--board-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-skip {
      background: #eab308;
      color: #000;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 2px;
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 170px;
      height: 90px;
    }

    .ctrl-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      background: var(--accent);
      color: #000;
    }

    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header>
      <h3 style="font-size: 13px;">🐍 كيمياء الثانوية العامة</h3>
      <div style="display: flex; gap: 4px;">
        <button class="pill-btn" id="speedBtn" onclick="cycleSpeed()">السرعة: متوسط ⚡</button>
        <button class="pill-btn" id="themeBtn" onclick="toggleTheme()">☀️ نهار</button>
      </div>
    </header>

    <div class="designer-banner">
      مصمم اللعبة: أ/ عبد الرحمن عبد الله - 01021779644
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div>النقاط</div>
        <div class="stat-val" id="score">0</div>
      </div>
      <div class="stat-card">
        <div>الأعلى</div>
        <div class="stat-val" id="highScore">0</div>
      </div>
      <div class="stat-card">
        <div>القلوب</div>
        <div class="stat-val" id="lives">❤️❤️❤️</div>
      </div>
      <div class="stat-card">
        <div>تخطي</div>
        <div class="stat-val" id="skips">3</div>
        <button class="btn-skip" onclick="skipQuestion()">تخطي</button>
      </div>
      <div class="stat-card">
        <div>الوقت</div>
        <div class="stat-val" id="timer">15</div>
      </div>
    </div>

    <div class="question-box" id="questionText">اضغط "ابدأ اللعب" للبدء</div>

    <div class="game-container" id="containerArea">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <div class="overlay" id="startOverlay">
        <h3 style="margin-bottom: 6px;">مرحباً بك يا بطل!</h3>
        <p style="font-size: 12px; opacity: 0.9; margin-bottom: 8px;">
          اقرأ وصف الخاصية جيداً وتوجّه نحو الرمز المناسب.<br>
          كل رمز صحيح = درجات وبونص وقت.
        </p>
        <button class="btn" onclick="startGame()">ابدأ التحدي</button>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <h3 style="color: var(--danger); margin-bottom: 6px;">انتهت اللعبة!</h3>
        <p style="font-size: 13px; margin-bottom: 4px;">مجموع درجاتك: <span id="finalScore" style="color: var(--accent); font-weight: bold; font-size: 16px;">0</span></p>
        <p style="font-size: 12px; margin-bottom: 8px; opacity: 0.85;">أعلى سكور مسجل: <span id="finalHighScore" style="font-weight: bold;">0</span></p>
        <button class="btn" onclick="startGame()">إعادة المحاولة</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="ctrl-btn up" onclick="handleDirection('UP')">⬆️</button>
      <button class="ctrl-btn left" onclick="handleDirection('LEFT')">⬅️</button>
      <button class="ctrl-btn down" onclick="handleDirection('DOWN')">⬇️</button>
      <button class="ctrl-btn right" onclick="handleDirection('RIGHT')">➡️</button>
    </div>
  </div>

  <script>
    const questionBank = [
      // 1. الغازات والأبخرة
      { q: "غاز يحدث فوراناً ويعكر ماء الجير الرائق لفترة قصيرة", correct: "CO₂", distractors: ["H₂S", "NO₂"] },
      { q: "غاز ذو رائحة نفاذة يخضر ورقة مبللة بـ K₂Cr₂O₇ المحمضة", correct: "SO₂", distractors: ["CO₂", "HI"] },
      { q: "غاز ذو رائحة كريهة يسود ورقة مبللة بأسيتات الرصاص", correct: "H₂S", distractors: ["SO₂", "HCl"] },
      { q: "غاز عديم اللون يتحول عند فوهة الأنبوبة إلى لون بني محمر", correct: "NO", distractors: ["CO₂", "HCl"] },
      { q: "غاز عديم اللون يكون سحب بيضاء مع ساق مبللة بمحلول النشادر", correct: "HCl", distractors: ["H₂S", "NO"] },
      { q: "أبخرة برتقالية حمراء تسبب اصفرار ورقة مبللة بالنشا", correct: "Br₂", distractors: ["I₂", "SO₂"] },
      { q: "أبخرة بنفسجية تسبب زرقة ورقة مبللة بمحلول النشا", correct: "I₂", distractors: ["Br₂", "CO₂"] },
      { q: "أبخرة بنية حمراء تزداد كثافتها بإضافة خراطة النحاس", correct: "NO₂", distractors: ["HCl", "H₂S"] },

      // 2. الرواسب وتفاعلاتها
      { q: "راسب أبيض يسود بالتسخين", correct: "Ag₂SO₃", distractors: ["Ag₂S", "Fe(OH)₃"] },
      { q: "راسب أسود يذوب في حمض النيتريك الساخن", correct: "CuS", distractors: ["BaSO₄", "Fe(OH)₂"] },
      { q: "راسب أبيض يصير بنفسجياً بالضوء ويذوب في محلول النشادر", correct: "AgCl", distractors: ["AgI", "Ag₂S"] },
      { q: "راسب أبيض مصفر يذوب ببطء في النشادر ويصير داكناً بالضوء", correct: "AgBr", distractors: ["Ag₂S", "CuS"] },
      { q: "راسب أصفر لا يذوب في محلول النشادر", correct: "AgI", distractors: ["Ag₃PO₄", "AgCl"] },
      { q: "راسب أصفر يذوب في محلول النشادر وفي حمض النيتريك", correct: "Ag₃PO₄", distractors: ["AgI", "PbS"] },
      { q: "راسب أبيض جيلاتيني يذوب في وفرة من الصودا الكاوية", correct: "Al(OH)₃", distractors: ["Fe(OH)₂", "Fe(OH)₃"] },
      { q: "راسب أبيض مخضر يذوب في الأحماض المخففة", correct: "Fe(OH)₂", distractors: ["Fe(OH)₃", "CuS"] },
      { q: "راسب بني محمر يذوب في الأحماض المخففة", correct: "Fe(OH)₃", distractors: ["Fe(OH)₂", "AgCl"] },
      { q: "راسب أبيض لا يذوب في حمض الهيدروكلوريك المخفف (HCl)", correct: "BaSO₄", distractors: ["Ba₃(PO₄)₂", "CuS"] },
      { q: "راسب أبيض يذوب في حمض الهيدروكلوريك المخفف (HCl)", correct: "Ba₃(PO₄)₂", distractors: ["BaSO₄", "AgI"] },
      { q: "راسب أبيض يذوب في الماء المحتوي على غاز ثاني أكسيد الكربون", correct: "CaCO₃", distractors: ["PbS", "CuS"] },

      // 3. الأنيونات
      { q: "أنيون مع حمض HCl المخفف يعطي راسباً أصفر معلقاً من الكبريت", correct: "S₂O₃²⁻", distractors: ["CO₃²⁻", "SO₄²⁻"] },
      { q: "أنيون جميع أملاحه تذوب في الماء ولا يكون رواسب في المنهج", correct: "HCO₃⁻", distractors: ["CO₃²⁻", "PO₄³⁻"] }
    ];

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(freq, type, duration) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    const speeds = [
      { name: "بطيء 🐢", delay: 170 },
      { name: "متوسط ⚡", delay: 125 },
      { name: "سريع 🚀", delay: 85 }
    ];
    let currentSpeedIdx = 1;

    function cycleSpeed() {
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      document.getElementById("speedBtn").innerText = `السرعة: ${speeds[currentSpeedIdx].name}`;
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = setInterval(gameStep, speeds[currentSpeedIdx].delay);
      }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const GRID_SIZE = 20; 
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let dir = { x: 0, y: -1 };
    let nextDir = { x: 0, y: -1 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem("chem_snake_highscore") || "0", 10);
    let lives = 3;
    let skips = 3;
    let timer = 15;
    let timerInterval = null;
    let gameLoopInterval = null;
    let currentQuestion = null;
    let foodItems = [];
    let highlightedItem = null;
    let unaskedQuestions = [];

    document.getElementById("highScore").innerText = highScore;

    function toggleTheme() {
      const body = document.documentElement;
      const btn = document.getElementById("themeBtn");
      if (body.getAttribute("data-theme") === "light") {
        body.removeAttribute("data-theme");
        btn.innerText = "☀️ نهار";
      } else {
        body.setAttribute("data-theme", "light");
        btn.innerText = "🌙 داكن";
      }
    }

    function startGame() {
      initAudio();
      document.getElementById("startOverlay").classList.add("hidden");
      document.getElementById("gameOverOverlay").classList.add("hidden");

      score = 0;
      lives = 3;
      skips = 3;
      snake = [
        { x: 10, y: 14 },
        { x: 10, y: 15 },
        { x: 10, y: 16 }
      ];
      dir = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      highlightedItem = null;
      unaskedQuestions = [...questionBank].sort(() => Math.random() - 0.5);

      updateStatsUI();
      nextQuestion();

      if (gameLoopInterval) clearInterval(gameLoopInterval);
      gameLoopInterval = setInterval(gameStep, speeds[currentSpeedIdx].delay);
    }

    function updateStatsUI() {
      document.getElementById("score").innerText = score;
      document.getElementById("highScore").innerText = highScore;
      document.getElementById("lives").innerText = "❤️".repeat(Math.max(0, lives));
      document.getElementById("skips").innerText = skips;
      document.getElementById("timer").innerText = timer;
    }

    function nextQuestion() {
      highlightedItem = null;
      if (unaskedQuestions.length === 0) {
        unaskedQuestions = [...questionBank].sort(() => Math.random() - 0.5);
      }
      currentQuestion = unaskedQuestions.pop();
      document.getElementById("questionText").innerText = currentQuestion.q;

      const choices = [
        { text: currentQuestion.correct, isCorrect: true },
        { text: currentQuestion.distractors[0], isCorrect: false },
        { text: currentQuestion.distractors[1], isCorrect: false }
      ].sort(() => Math.random() - 0.5);

      foodItems = [];
      choices.forEach(c => {
        let pos;
        let attempts = 0;
        while (!pos || isOccupied(pos.x, pos.y)) {
          pos = {
            x: Math.floor(Math.random() * (TILE_COUNT - 4)) + 1,
            y: Math.floor(Math.random() * (TILE_COUNT - 4)) + 2
          };
          attempts++;
          if (attempts > 150) break;
        }
        foodItems.push({ ...pos, text: c.text, isCorrect: c.isCorrect });
      });

      clearInterval(timerInterval);
      timer = 15;
      document.getElementById("timer").innerText = timer;
      timerInterval = setInterval(() => {
        timer--;
        document.getElementById("timer").innerText = timer;
        if (timer <= 0) handleWrongChoice();
      }, 1000);
    }

    function isOccupied(x, y) {
      if (snake.some(segment => (segment.x === x || segment.x === x + 1) && segment.y === y)) return true;
      if (foodItems.some(item => Math.abs(item.x - x) <= 2 && Math.abs(item.y - y) <= 1)) return true;
      return false;
    }

    function skipQuestion() {
      if (skips > 0) {
        skips--;
        playTone(400, 'sine', 0.1);
        updateStatsUI();
        nextQuestion();
      }
    }

    function handleWrongChoice() {
      playTone(180, 'sawtooth', 0.25);
      lives--;
      updateStatsUI();

      const correctItem = foodItems.find(item => item.isCorrect);
      if (correctItem) {
        highlightedItem = { ...correctItem, alpha: 1.0 };
      }
      foodItems = [];

      clearInterval(timerInterval);

      if (lives <= 0) {
        gameOver();
        return;
      }

      setTimeout(() => {
        highlightedItem = null;
        nextQuestion();
      }, 1300);
    }

    function gameOver() {
      playTone(130, 'sawtooth', 0.35);
      clearInterval(gameLoopInterval);
      clearInterval(timerInterval);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("chem_snake_highscore", highScore);
      }

      document.getElementById("finalScore").innerText = score;
      document.getElementById("finalHighScore").innerText = highScore;
      document.getElementById("highScore").innerText = highScore;
      document.getElementById("gameOverOverlay").classList.remove("hidden");
    }

    function gameStep() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;

      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          lives--;
          playTone(180, 'sawtooth', 0.25);
          updateStatsUI();
          snake = snake.slice(0, Math.max(3, i));
          if (lives <= 0) {
            gameOver();
            return;
          }
          break;
        }
      }

      snake.unshift(head);

      let eatenIdx = foodItems.findIndex(f => (head.x === f.x || head.x === f.x + 1) && head.y === f.y);
      if (eatenIdx !== -1) {
        let eaten = foodItems[eatenIdx];
        if (eaten.isCorrect) {
          playTone(520, 'triangle', 0.1);
          score += 10 + timer;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem("chem_snake_highscore", highScore);
          }
          updateStatsUI();
          nextQuestion();
        } else {
          handleWrongChoice();
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      const styles = getComputedStyle(document.body);
      ctx.fillStyle = styles.getPropertyValue('--board-bg').trim();
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      foodItems.forEach(item => {
        ctx.fillStyle = styles.getPropertyValue('--item-bg').trim();
        ctx.beginPath();
        ctx.roundRect(item.x * GRID_SIZE, item.y * GRID_SIZE, GRID_SIZE * 2, GRID_SIZE, 5);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.text, item.x * GRID_SIZE + GRID_SIZE, item.y * GRID_SIZE + (GRID_SIZE * 0.5));
      });

      if (highlightedItem) {
        ctx.fillStyle = `rgba(16, 185, 129, ${highlightedItem.alpha})`;
        ctx.shadowColor = "#10b981";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(highlightedItem.x * GRID_SIZE - 2, highlightedItem.y * GRID_SIZE - 2, GRID_SIZE * 2 + 4, GRID_SIZE + 4, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10.5px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(highlightedItem.text, highlightedItem.x * GRID_SIZE + GRID_SIZE, highlightedItem.y * GRID_SIZE + (GRID_SIZE * 0.5));
      }

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 
          ? styles.getPropertyValue('--snake-head').trim() 
          : styles.getPropertyValue('--snake-body').trim();
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
        ctx.fill();
      });
    }

    function handleDirection(newDir) {
      if (newDir === 'UP' && dir.y === 0) nextDir = { x: 0, y: -1 };
      if (newDir === 'DOWN' && dir.y === 0) nextDir = { x: 0, y: 1 };
      if (newDir === 'LEFT' && dir.x === 0) nextDir = { x: -1, y: 0 };
      if (newDir === 'RIGHT' && dir.x === 0) nextDir = { x: 1, y: 0 };
    }

    window.addEventListener("keydown", e => {
      if (["ArrowUp", "KeyW"].includes(e.code)) handleDirection('UP');
      if (["ArrowDown", "KeyS"].includes(e.code)) handleDirection('DOWN');
      if (["ArrowLeft", "KeyA"].includes(e.code)) handleDirection('LEFT');
      if (["ArrowRight", "KeyD"].includes(e.code)) handleDirection('RIGHT');
    });

    let touchStartX = 0;
    let touchStartY = 0;
    const container = document.getElementById('containerArea');
    
    container.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    container.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].screenX - touchStartX;
      let dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 25) handleDirection('RIGHT');
        else if (dx < -25) handleDirection('LEFT');
      } else {
        if (dy > 25) handleDirection('DOWN');
        else if (dy < -25) handleDirection('UP');
      }
    }, { passive: true });
  </script>
</body>
</html>
